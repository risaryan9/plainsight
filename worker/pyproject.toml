[project]
name = "plainsight-worker"
version = "0.1.0"
description = "Plainsight analysis worker: static APK extraction pipeline"
requires-python = ">=3.12"
dependencies = [
    # Pinned exactly: the Androguard API changes between releases, and only
    # pipeline/extraction/androguard_adapter.py may import it (spec §7.7).
    "androguard==4.1.4",
    "beautifulsoup4>=4.12",
    "google-play-scraper==1.2.7",
    "httpx>=0.27",
    "loguru>=0.7",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "trafilatura>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

# Ship the curated data files inside non-editable builds (see pipeline/extraction/knowledge.py).
[tool.hatch.build.targets.wheel.force-include]
"data" = "pipeline/_data"
