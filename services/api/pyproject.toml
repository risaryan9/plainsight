[project]
name = "plainsight-api"
version = "0.1.0"
description = "Plainsight HTTP API: accepts APK uploads and runs the extraction pipeline"
requires-python = ">=3.12"
dependencies = [
    "plainsight-worker",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
]

[tool.uv.sources]
plainsight-worker = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
