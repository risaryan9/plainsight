[project]
name = "plainsight-bot"
version = "0.1.0"
description = "Plainsight Telegram bot: a thin adapter between Telegram and the API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "python-telegram-bot>=21,<23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]
